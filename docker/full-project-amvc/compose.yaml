name: amvc-project
services: 
  amvc:
    build:
      context: ../..
      dockerfile: docker/full-project-amvc/Dockerfile
    restart: unless-stopped
    ports:
      - "4501:4501"
    env_file:
      - ../../.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - whisper_cache:/root/.cache

volumes:
  whisper_cache:
